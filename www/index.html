<!DOCTYPE html>
<html lang="en">
<head>
    <script src="./script/pageInit.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YEB-HOME</title>
    <style>
        .smallUnit {
            background-color: gray;
            color: black;
            width: 50%;
        }
        .bigUnit {
            background-color: black;
            width: 50%;
            height: 100%;
        }
        .lineUnit{
            display: flex;
            height: 50%;
        }
    </style>
</head>
<body style="width: 100%;height: 100vh;margin: 0;">
    <div style="width: 100%;height: 100%;">
        <div class="lineUnit">
            <div class="bigUnit" style="display: flex;justify-content: center;align-items: center;overflow: hidden;">
                <div style="color: gray;font-size: 16cqw;line-height: 1;white-space: nowrap;">YxsEB!</div>
            </div>
            <div class="bigUnit">
                <div class="lineUnit">
                    <div class="smallUnit"></div>
                    <div class="smallUnit"></div>
                </div>
                <div class="lineUnit">
                    <div class="smallUnit"></div>
                    <div class="smallUnit"></div>
                </div>
            </div>
        </div>
        <div class="lineUnit">
            <div class="bigUnit">
                <div class="lineUnit">
                    <div class="smallUnit"></div>
                    <div class="smallUnit"></div>
                </div>
                <div class="lineUnit">
                    <div class="smallUnit"></div>
                    <div class="smallUnit"></div>
                </div>
            </div>
            <div class="bigUnit" id="ads"></div>
        </div>
    </div>
    <script>
        for(let i of document.getElementsByClassName("smallUnit")){
            i.addEventListener("mouseenter",()=>{
                i.style.backgroundColor = "green"
            });
            i.addEventListener("mouseleave", () => {
                i.style.backgroundColor = "";
            });
        };
        let ads = document.getElementById("ads");
        ads.innerHTML = '<img style="display: block" height="100%" width="100%" src="https://i1.hdslb.com/bfs/archive/888d2fb37049c9a4c34bda3a90a5c6464b604caa.jpg">'
    </script>
</body>
</html>
